[workspace]
members = [
    "tests",
    "gsm7-rs",
    "glib-boilerplates",
    "libqmi-glib-sys",
    "libqmi-glib-types-rs",
    "libqmi-glib-rs",
    "qrtr-sys",
    "qrtr-minimal",
    "qmi-sim-manager",
]
resolver = "3"

[workspace.dependencies]
gsm7-rs = { path = "gsm7-rs", version = "0.4.0" }
glib-boilerplates = { path = "glib-boilerplates", version = "0.1.0" }
libqmi-glib-sys = { path = "libqmi-glib-sys", features = ["v1_32"], version = "0.1.0" }
libqmi-glib-types-rs = { path = "libqmi-glib-types-rs", features = ["v1_32"], version = "0.1.3" }
libqmi-glib-rs = { path = "libqmi-glib-rs", features = [], version = "0.1.3" }
qrtr-sys = { path = "qrtr-sys", version = "0.1.1" }
qrtr-minimal = { path = "qrtr-minimal", version = "0.1.1" }
qmi-sim-manager = { path = "qmi-sim-manager", version = "0.1.3", features = ["at-at"] }

glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"
glib = "0.22"
gio = "0.22"
glib-unix = "0.22"
libc = "0.2"
futures = "0.3"
tracing = "0.1"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
