[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[dependencies]
qrtr-sys.workspace = true

glib-sys.workspace = true
gobject-sys.workspace = true
gio-sys.workspace = true
libc.workspace = true

[build-dependencies]
system-deps = "7"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v1_4 = []
v1_6 = ["v1_4"]
v1_8 = ["v1_6"]
