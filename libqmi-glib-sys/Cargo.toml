[package.metadata.system-deps.qmi_glib.v1_28_6]
version = "1.28.6"

[package.metadata.system-deps.qmi_glib.v1_30]
version = "1.30"

[package.metadata.system-deps.qmi_glib.v1_30_2]
version = "1.30.2"

[package.metadata.system-deps.qmi_glib.v1_32]
