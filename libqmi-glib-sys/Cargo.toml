version = "1.10"

[package.metadata.system-deps.qmi_glib.v1_12]
version = "1.12"

[package.metadata.system-deps.qmi_glib.v1_14]
version = "1.14"

[package.metadata.system-deps.qmi_glib.v1_16]
version = "1.16"

[package.metadata.system-deps.qmi_glib.v1_18]
version = "1.18"

[package.metadata.system-deps.qmi_glib.v1_20]
version = "1.20"

[package.metadata.system-deps.qmi_glib.v1_22]
version = "1.22"

[package.metadata.system-deps.qmi_glib.v1_22_4]
version = "1.22.4"

[package.metadata.system-deps.qmi_glib.v1_24]
version = "1.24"

[package.metadata.system-deps.qmi_glib.v1_24_6]
version = "1.24.6"

[package.metadata.system-deps.qmi_glib.v1_26]
version = "1.26"

[package.metadata.system-deps.qmi_glib.v1_26_2]
