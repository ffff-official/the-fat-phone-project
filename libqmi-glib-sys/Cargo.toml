[package]
name = "libqmi-glib-sys"
version = "0.1.0"
edition = "2024"
authors = ["bmickael <bmickael@proton.me>"]
repository = "https://gitlab.com/mordaklavache/the-fat-phone-project"
description = "Rust bindings for the libqmi-glib library"
readme = "README.md"
keywords = ["gsm", "qmi", "sms", "mms", "phone"]
license = "MIT/Apache-2.0"
build = "build.rs"

[package.metadata.system-deps.qmi_glib]
name = "qmi-glib"
version = "1"

[package.metadata.system-deps.qmi_glib.v1_4]
version = "1.4"

[package.metadata.system-deps.qmi_glib.v1_6]
version = "1.6"

