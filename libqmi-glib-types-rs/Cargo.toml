[package]
name = "libqmi-glib-types-rs"
version = "0.1.2"
edition = "2024"
authors = ["bmickael <bmickael@proton.me>"]
repository = "https://gitlab.com/mordaklavache/the-fat-phone-project"
description = "Rust definitions of the enums and flags from libqmi-glib"
readme = "README.md"
keywords = [
    "libqmi",
    "qmi",
    "glib",
    "bindings",
    "enums",
]
license = "MIT/Apache-2.0"

[dependencies]
libqmi-glib-sys.workspace = true
qrtr-minimal.workspace = true
qrtr-sys.workspace = true
glib-boilerplates.workspace = true

glib.workspace = true
gio.workspace = true
glib-sys.workspace = true

[build-dependencies]
system-deps = "7"

[features]
default = ["v1_36"]

v1_4 = ["libqmi-glib-sys/v1_4"]
v1_6 = ["libqmi-glib-sys/v1_6", "v1_4"]
v1_8 = ["libqmi-glib-sys/v1_8", "v1_6"]
v1_10 = ["libqmi-glib-sys/v1_10", "v1_8"]
v1_12 = ["libqmi-glib-sys/v1_12", "v1_10"]
v1_14 = ["libqmi-glib-sys/v1_14", "v1_12"]
v1_16 = ["libqmi-glib-sys/v1_16", "v1_14"]
v1_18 = ["libqmi-glib-sys/v1_18", "v1_16"]
v1_20 = ["libqmi-glib-sys/v1_20", "v1_18"]
v1_22 = ["libqmi-glib-sys/v1_22", "v1_20"]
v1_22_4 = ["libqmi-glib-sys/v1_22_4", "v1_22"]
v1_24 = ["libqmi-glib-sys/v1_24", "v1_22_4"]
v1_24_6 = ["libqmi-glib-sys/v1_24_6", "v1_24"]
v1_26 = ["libqmi-glib-sys/v1_26", "v1_24_6"]
v1_26_2 = ["libqmi-glib-sys/v1_26_2", "v1_26"]
v1_26_6 = ["libqmi-glib-sys/v1_26_6", "v1_26_2"]
v1_28 = ["libqmi-glib-sys/v1_28", "v1_26_6"]
v1_28_6 = ["libqmi-glib-sys/v1_28_6", "v1_28"]
v1_30 = ["libqmi-glib-sys/v1_30", "v1_28_6"]
v1_30_2 = ["libqmi-glib-sys/v1_30_2", "v1_30"]
v1_32 = ["libqmi-glib-sys/v1_32", "v1_30_2"]
v1_34 = ["libqmi-glib-sys/v1_34", "v1_32"]
v1_36 = ["libqmi-glib-sys/v1_36", "v1_34"]
