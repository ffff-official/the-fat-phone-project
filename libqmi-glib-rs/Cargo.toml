[package]
name = "libqmi-glib-rs"
version = "0.1.3"
edition = "2024"
authors = ["bmickael <bmickael@proton.me>"]
repository = "https://gitlab.com/mordaklavache/the-fat-phone-project"
description = "A minimal, safe Rust interface for libqmi"
readme = "README.md"
keywords = ["gsm", "qmi", "sms", "mms", "phone"]
license = "MIT/Apache-2.0"

[dependencies]
libqmi-glib-sys.workspace = true
libqmi-glib-types-rs.workspace = true

glib-sys.workspace = true
gobject-sys.workspace = true
gio-sys.workspace = true
tracing.workspace = true
futures.workspace = true

[dev-dependencies]
glib.workspace = true

[features]
v1_10 = ["libqmi-glib-sys/v1_10", "libqmi-glib-types-rs/v1_10"]
v1_14 = ["libqmi-glib-sys/v1_14", "libqmi-glib-types-rs/v1_14", "v1_10"]
v1_20 = ["libqmi-glib-sys/v1_20", "libqmi-glib-types-rs/v1_20", "v1_14"]
v1_22 = ["libqmi-glib-sys/v1_22", "libqmi-glib-types-rs/v1_22", "v1_20"]
v1_24 = ["libqmi-glib-sys/v1_24", "libqmi-glib-types-rs/v1_24", "v1_22"]
v1_26 = ["libqmi-glib-sys/v1_26", "libqmi-glib-types-rs/v1_26", "v1_24"]
v1_32 = ["libqmi-glib-sys/v1_32", "libqmi-glib-types-rs/v1_32", "v1_26"]
v1_34 = ["libqmi-glib-sys/v1_34", "libqmi-glib-types-rs/v1_34", "v1_32"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]