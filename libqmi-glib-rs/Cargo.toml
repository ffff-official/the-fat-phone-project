[package]
name = "libqmi-glib-rs"
version = "0.1.1"
edition = "2024"
authors = ["bmickael <bmickael@proton.me>"]
repository = "https://gitlab.com/mordaklavache/the-fat-phone-project"
description = "A minimal, safe Rust interface for libqmi"
readme = "README.md"
keywords = ["gsm", "qmi", "sms", "mms", "phone"]
license = "MIT/Apache-2.0"

[dependencies]
libqmi-glib-sys.workspace = true
libqmi-glib-types-rs.workspace = true

glib-sys.workspace = true
gobject-sys.workspace = true
gio-sys.workspace = true
tracing.workspace = true
futures.workspace = true

[dev-dependencies]
glib.workspace = true